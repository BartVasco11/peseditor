name: Regenerate lockfile (temporary)

on:
  push:
    branches:
      - fix/streamdown-langium-build
    paths:
      - package.json
      - .github/workflows/regenerate-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/streamdown-langium-build
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "Regenerate lockfile for patched Next.js and React"
            git push origin HEAD:fix/streamdown-langium-build
          fi
